<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Evening Review — Full Process Flowchart</title>
  <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
  <link  href="https://unpkg.com/vis-network@9.1.9/dist/dist/vis-network.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; }

    /* ── Top bar ── */
    #topbar {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: #181825; border-bottom: 1px solid #313244; flex-shrink: 0; flex-wrap: wrap;
    }
    #topbar h1 { font-size: 15px; color: #cba6f7; white-space: nowrap; }
    .btn {
      padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    #physicsBtn  { background: #a6e3a1; color: #1e1e2e; }
    #fitBtn      { background: #89b4fa; color: #1e1e2e; }
    #resetBtn    { background: #f38ba8; color: #1e1e2e; }
    #searchBox {
      padding: 4px 10px; border-radius: 6px; border: 1px solid #45475a;
      background: #313244; color: #cdd6f4; font-size: 12px; width: 180px;
    }
    #searchBox::placeholder { color: #6c7086; }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Legend ── */
    #legend {
      width: 200px; flex-shrink: 0; background: #181825;
      border-right: 1px solid #313244; padding: 10px; overflow-y: auto; font-size: 11px;
    }
    #legend h2 { font-size: 12px; color: #89b4fa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
    .leg-item { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; border-radius: 4px; padding-left: 4px; }
    .leg-item:hover { background: #313244; }
    .leg-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .leg-label { color: #cdd6f4; line-height: 1.3; }

    /* ── Canvas ── */
    #network { flex: 1; }

    /* ── Tooltip card ── */
    #infocard {
      position: fixed; bottom: 18px; right: 18px; width: 280px;
      background: #313244; border: 1px solid #45475a; border-radius: 10px;
      padding: 12px 14px; font-size: 12px; display: none; z-index: 99;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    #infocard h3 { font-size: 13px; color: #cba6f7; margin-bottom: 6px; }
    #infocard p  { color: #a6adc8; line-height: 1.5; }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>🌙 Evening Review — Full Process Flowchart</h1>
  <button class="btn" id="physicsBtn">⏸ Freeze</button>
  <button class="btn" id="fitBtn">⬜ Fit All</button>
  <button class="btn" id="resetBtn">↺ Reset Layout</button>
  <input id="searchBox" type="text" placeholder="Search node…" />
  <span style="font-size:11px;color:#6c7086;">Drag nodes · Scroll to zoom · Click for info</span>
</div>

<!-- Main area -->
<div id="main">
  <div id="legend">
    <h2>Subsystems</h2>
    <!-- filled by JS -->
  </div>
  <div id="network"></div>
</div>

<!-- Info card -->
<div id="infocard">
  <h3 id="cardTitle"></h3>
  <p  id="cardBody"></p>
</div>

// ─────────────────────────────────────────────────────────────────────────────
// BUILD VIS-NETWORK DATASETS
// ─────────────────────────────────────────────────────────────────────────────
function groupColor(g) { return (GROUPS[g] || {color:"#6c7086"}).color; }

const nodes = new vis.DataSet(rawNodes.map(n => ({
  id:    n.id,
  label: n.label,
  group: n.group,
  color: {
    background: groupColor(n.group),
    border:     "#1e1e2e",
    highlight:  { background:"#ffffff", border:"#cba6f7" },
    hover:      { background:"#f5c2e7", border:"#cba6f7" },
  },
  font:  { color:"#1e1e2e", size:11, face:"Segoe UI", multi:false },
  shape: "box",
  borderWidth: 1,
  borderWidthSelected: 3,
  margin: 8,
  shadow: true,
  title: DESC[n.id] || n.label,
})));

const edges = new vis.DataSet(rawEdges.map(([from,to,label],i) => ({
  id: i,
  from, to,
  label: label || undefined,
  arrows: "to",
  color:  { color:"#45475a", highlight:"#cba6f7", hover:"#89b4fa" },
  font:   { color:"#a6adc8", size:9, strokeWidth:2, strokeColor:"#1e1e2e" },
  smooth: { type:"cubicBezier", forceDirection:"horizontal", roundness:0.4 },
  width: 1.5,
  selectionWidth: 3,
})));

// ─────────────────────────────────────────────────────────────────────────────
// CREATE NETWORK
// ─────────────────────────────────────────────────────────────────────────────
const container = document.getElementById("network");
const options = {
  layout: {
    hierarchical: {
      enabled: true,
      direction: "LR",
      sortMethod: "directed",
      levelSeparation: 220,
      nodeSpacing: 90,
      treeSpacing: 160,
      blockShifting: true,
      edgeMinimization: true,
      parentCentralization: true,
    }
  },
  physics: {
    enabled: false,   // start frozen for readability; user can enable
    hierarchicalRepulsion: {
      nodeDistance: 110,
    },
  },
  interaction: {
    hover: true,
    tooltipDelay: 200,
    zoomView: true,
    dragNodes: true,
    dragView: true,
    multiselect: true,
    keyboard: true,
  },
  nodes: { widthConstraint: { maximum: 180 } },
  edges: { font: { align:"middle" } },
};

const network = new vis.Network(container, { nodes, edges }, options);

// ─────────────────────────────────────────────────────────────────────────────
// INFO CARD
// ─────────────────────────────────────────────────────────────────────────────
const infocard = document.getElementById("infocard");
const cardTitle = document.getElementById("cardTitle");
const cardBody  = document.getElementById("cardBody");

network.on("click", params => {
  if (params.nodes.length === 0) { infocard.style.display = "none"; return; }
  const id   = params.nodes[0];
  const node = nodes.get(id);
  const desc = DESC[id] || "No description.";
  cardTitle.textContent = node.label.replace(/\n/g," ");
  cardBody.textContent  = desc;
  infocard.style.display = "block";
});

network.on("deselectNode", () => { infocard.style.display = "none"; });

// ─────────────────────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────────────────────
let physicsOn = false;
document.getElementById("physicsBtn").addEventListener("click", () => {
  physicsOn = !physicsOn;
  network.setOptions({ physics: { enabled: physicsOn } });
  document.getElementById("physicsBtn").textContent = physicsOn ? "⏸ Freeze" : "▶ Animate";
});

document.getElementById("fitBtn").addEventListener("click", () => network.fit({ animation: { duration:600, easingFunction:"easeInOutQuad" } }));

document.getElementById("resetBtn").addEventListener("click", () => {
  network.setOptions({ layout:{ hierarchical:{ enabled:true } } });
  network.fit({ animation: true });
});

// Search / highlight
let highlighted = [];
document.getElementById("searchBox").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  // reset previous
  highlighted.forEach(id => {
    const n = nodes.get(id);
    if (n) nodes.update({ id, color:{ background:groupColor(n.group), border:"#1e1e2e" }});
  });
  highlighted = [];
  if (!q) return;
  const matches = nodes.get({ filter: n => n.label.toLowerCase().includes(q) || (DESC[n.id]||"").toLowerCase().includes(q) });
  if (!matches.length) return;
  matches.forEach(n => {
    nodes.update({ id:n.id, color:{ background:"#f9e2af", border:"#fab387" } });
    highlighted.push(n.id);
  });
  network.fit({ nodes: matches.map(n=>n.id), animation:{ duration:500 } });
});

// ─────────────────────────────────────────────────────────────────────────────
// BUILD LEGEND
// ─────────────────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
Object.entries(GROUPS).forEach(([key, {color, label}]) => {
  const div = document.createElement("div");
  div.className = "leg-item";
  div.title = `Click to highlight all ${label} nodes`;
  div.innerHTML = `<div class="leg-dot" style="background:${color}"></div><span class="leg-label">${label}</span>`;
  div.addEventListener("click", () => {
    // reset all
    nodes.get().forEach(n => nodes.update({ id:n.id, color:{ background:groupColor(n.group), border:"#1e1e2e" } }));
    highlighted = [];
    // highlight group
    const grpNodes = nodes.get({ filter:n => n.group === key });
    grpNodes.forEach(n => { nodes.update({ id:n.id, color:{ background:"#f9e2af", border:"#fab387" } }); highlighted.push(n.id); });
    network.fit({ nodes:grpNodes.map(n=>n.id), animation:{ duration:500 } });
  });
  legendEl.appendChild(div);
});

// Initial fit
network.once("stabilized", () => network.fit({ animation:false }));
