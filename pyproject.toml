[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-to-refinedtext"
version = "0.2.0"
description = "Universal Offline Speech Refinement & Portability Engine for Ubuntu 22.04 through 26.04"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Manoj Bisht", email = "er_manojbisht@yahoo.com" }
]
keywords = [
    "voice-recognition",
    "speech-to-text",
    "whisper",
    "nemotron",
    "ollama",
    "wayland",
    "push-to-talk",
    "pwd-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core headless dependencies compatible with Python 3.10 through 3.14
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "requests>=2.28",
    "pystray>=0.19",
    "Pillow>=10.0",
    "ollama>=0.4.4",
    "langdetect>=1.0.9",
    "rich>=13.0",
    "kokoro-onnx>=0.3.0",
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Accelerated Speech Recognition backends
gpu = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
]
vulkan = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
]

# Graphical User Interface & Visual Overlays
gui = [
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
    "pynput>=1.7.6",
    "python-xlib>=0.29; sys_platform == 'linux'",
]

# Audio-to-Idea batch processing & synthesis
audio-to-idea = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
]

# Documentation & Manual generation
docs = [
    "markdown>=3.4",
]

# Developer test runner & quality tools
test = [
    "pytest>=8.0",
    "typeguard>=4.0",
]

# All-in-one complete desktop installation
all = [
    "voice-to-refinedtext[gpu,gui,audio-to-idea,docs,test]",
]

[project.scripts]
voice-refiner = "tray_app:main"
voice-doctor = "doctor:main"
audio2idea = "audio_to_idea.cli:main"

[project.gui-scripts]
audio2idea-gui = "audio_to_idea.cli:gui_main"

[tool.setuptools]
py-modules = [
    "engine",
    "doctor",
    "tray_app",
    "main_gui",
    "settings_server",
    "manual_service",
    "manual_gui",
    "hotkey_manager",
    "hotkey_coordinator",
    "dashboard_web",
    "storage",
    "overlay",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_to_idea*", "pwd_helper*"]

[tool.setuptools.package-data]
audio_to_idea = ["example_profiles/*.json", "prompt_templates/*.txt"]
pwd_helper = ["*.json"]
